# pre-commit: checks that run on every `git commit`, whoever commits: you, Claude Code, Cursor,
# Copilot or a script. Install once with `make hooks` (again after this file changes).
# pyright and the tests are not here: they take seconds to minutes, too slow for every commit,
# and the tests need Postgres. They run in /verify, and in CI from C-107.
# Every rev is a release at least 14 days old (AGENTS.md: the cooldown), pinned by commit SHA
# with the tag and date in the comment: a tag can be moved to other code, a SHA can't.
minimum_pre_commit_version: "4.6.2"
# Files a tool or the starter zip writes. No hook fixes their whitespace or reads them as code.
exclude: ^(data/world\.json|.*uv\.lock)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0, Aug 9, 2025
    hooks:
      - id: check-yaml # a YAML file that doesn't parse breaks a workflow or a manifest
        args: [--allow-multiple-documents] # Kubernetes files hold several documents (C-203)
        # Its one dependency, which pre-commit-hooks leaves unpinned: this hook is the only one
        # that imports it, so pinning it here pins every copy that runs.
        additional_dependencies: [ruamel.yaml==0.19.1] # Jan 2026
      - id: check-json
      - id: check-toml # pyproject.toml: a broken one stops uv
      - id: end-of-file-fixer # exactly one newline at the end: a fixer, so re-add and commit
      - id: trailing-whitespace # a fixer too; whitespace-only diffs hide the real change
        args: [--markdown-linebreak-ext=md] # two spaces end a line in Markdown: keep them
      - id: check-merge-conflict # a leftover <<<<<<< marker
      - id: check-added-large-files # data and binaries don't belong in Git
        args: [--maxkb=500, --enforce-all] # every file, so `run --all-files` checks them all
      - id: detect-private-key # a pasted -----BEGIN ... PRIVATE KEY----- block
      - id: no-commit-to-branch # main changes only by a merged pull request
        args: [--branch, main]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10, Oct 1, 2026
    # The ruff in api/uv.lock, so the hook and `uv run ruff` agree. Bump them together.
    hooks:
      # No `files:` filter: each file uses the [tool.ruff] of its own project's pyproject.toml
      # (api/, llmkit/), so a later project with its own [tool.ruff] needs no change here.
      - id: ruff-check # lint only; the editing hook already applied the safe fixes
      - id: ruff-format # a fixer: the same formatting as format-python.sh
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1, Mar 12, 2026
    hooks:
      # Secrets in the staged diff: keys, tokens and passwords by pattern (Anthropic, AWS, GitHub,
      # generic). A Go program: pre-commit downloads this Go version into its own cache and builds
      # gitleaks once, so no Go install is needed and it runs offline afterwards.
      - id: gitleaks
        language_version: 1.27.2 # Oct 8, 2026
        stages: [pre-commit]
      # The same scanner over every commit behind HEAD, for CI (`--hook-stage manual`): a commit
      # made with the hooks skipped is still scanned before it merges.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (every commit)
        entry: gitleaks git --redact --verbose --log-opts=HEAD
        language_version: 1.27.2
        stages: [manual]
