services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: countersign
      POSTGRES_DB: countersign
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign -d countersign"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dbdata:
